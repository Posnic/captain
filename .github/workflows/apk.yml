# Build the Android app, so an APK does not depend on one particular laptop.
#
# Producing an installable build used to mean having the JDK, the Android SDK
# and the right build-tools on the machine you happened to be sitting at, and
# build-apk.js only ran on Windows. A runner already has all of it.
#
# Every push builds a debug APK and attaches it to the run, so there is always
# a current build to put on a phone without anybody setting up a toolchain.
name: APK

# ONE RUN PER COMMIT, NOT TWO.
#
# This used to be `push: ['**']` alongside `pull_request`, and the two overlap:
# every commit on a branch with a PR open built the APK and ran the browser
# suite TWICE, five minutes each, for one identical tree. The checks list
# showed it plainly - two "Tests", two "Debug APK", two run ids.
#
# A branch is covered by its pull request, and main is covered on merge. A tag
# is release.yml's business. Nothing is watched less closely; the same commit is
# simply not built twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first build irrelevant.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Tests that nothing runs are documentation, and stale documentation at that.
  # This repository had 41 of them and a build job that only proved the app
  # compiles, which it would do just as happily with the search returning
  # nothing.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Pure logic: the search ranking and anything else that deserves to be
      # checked in milliseconds rather than in a browser.
      - name: Unit tests
        run: npm test

      - name: Install a browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  debug:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # Android Gradle Plugin wants 17. The runner's default has moved past it
      # before now, and the failure that produces names a Gradle internal
      # rather than the JDK, so it is pinned here.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # THE `tools` PACKAGE NO LONGER EXISTS, so do not ask for it.
      #
      # setup-android installs `tools platform-tools` by default, and Google
      # has removed `tools` from the SDK repository - it was deprecated for
      # years and finally went. The action runs `sdkmanager tools`, gets exit
      # code 1, and the whole job dies before a line of our code is reached.
      #
      # Nothing here needs it. The runner image already carries the SDK, and
      # Gradle fetches the platform and build-tools it wants on its own.
      #
      # It broke on the runner, not in this repository: the same workflow
      # passed yesterday on the same commit shape, and started failing at
      # 07:54 on 2026-09-15 for every branch at once. That is the signature of
      # an image or a repository change rather than a regression.
      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install
        run: npm ci

      - name: Build
        run: node build-apk.js

      # Named for the commit, because "app-debug.apk" in a downloads folder
      # tells you nothing about which build it is.
      - name: Name the build
        id: name
        run: echo "name=captain-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
